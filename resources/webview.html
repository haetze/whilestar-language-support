<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While* visual interpreter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* Top section */

        button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.3s;
        }

        button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .action.tutorial-highlight {
            outline: 3px solid #ff9800;
            box-shadow: 0 0 0 4px rgba(255, 152, 0, 0.28);
        }

        input {
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            padding: 12px;
            border-radius: 12px;
            border: none;
        }

        input::placeholder {
            color: var(--vscode-input-placeholderForeground);
        }

        label {
            color: var(--vscode-input-placeholderForeground);
        }

        body {
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            margin: 0;
        }

        .container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-group {
            border: 1px solid var(--vscode-panel-border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--vscode-editorWidget-background);
        }

        .panel-group summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 14px;
            font-weight: 600;
            border-bottom: 1px solid transparent;
        }

        .panel-group[open] summary {
            border-bottom-color: var(--vscode-panel-border);
        }

        .panel-group summary::-webkit-details-marker {
            display: none;
        }

        .panel-group .panel-body {
            padding: 12px;
        }

        .panel-group.tutorial-open {
            border-color: #ff9800;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .settings {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.2s ease-out;
            max-height: 1000px;
            opacity: 1;
        }

        .settings.hidden {
            max-height: 0;
            opacity: 0;
            margin: 0;
            padding: 0;
        }

        .tutorial-banner {
            display: none;
            gap: 12px;
            padding: 14px;
            border: 1px solid var(--vscode-textLink-foreground);
            border-radius: 10px;
            background: var(--vscode-editorWidget-background);
        }

        .tutorial-banner.active {
            display: grid;
        }

        .tutorial-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tutorial-actions button.tutorial-highlight {
            border-color: #ff8c00;
            background: rgba(255, 140, 0, 0.18);
            color: #ffd3a1;
            box-shadow: 0 0 0 2px rgba(255, 140, 0, 0.28);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            padding: 0;
            margin: 0;
        }

        hr {
            border-color: var(--vscode-panel-border);
            width: 100%;
        }


        pre {
            white-space: pre;
            word-break: normal;
            padding: 16px;
            border-radius: 8px;
            background-color: var(--vscode-editorWidget-background);
            color: var(--vscode-editor-foreground);
            height: fit-content;
            font-size: 0.8rem;
            line-height: 1.5;
            overflow-x: scroll;
        }

        /* Output section */

        #output {
            /* background-color: var(--vscode-editorWidget-background);
            color: var(--vscode-editor-foreground);
            padding: 12px;
            border-radius: 12px; */

            overflow-y: hidden;
            overflow-x: auto;
            height: 100%;
            font-size: 1rem;
            /* animation: scale 0.3s ease-in-out; */
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        @keyframes scale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #settingsToggle {
            position: absolute;
            top: 24px;
            right: 32px;
            color: var(--vscode-textLink-foreground);
            cursor: pointer;
            user-select: none;
        }

        #settingsToggle:hover {
            text-decoration: underline;
        }

        /* Debug specific styles */
        .debug button {
            padding: 4px 16px;
            border-radius: 6px;
        }

        .debug-content {
            margin-top: 12px;
        }

        .debug-step {
            display: grid;
            gap: 24px;
            grid-template-columns: 1fr;
        }

        .debug-step .proof {
            grid-column: 1 / -1;
        }

        @media screen and (min-width: 600px) {
            .debug-step {
                grid-template-columns: 1fr 1fr;
            }

            .configuration {
                grid-column: 1 / -1;
            }
        }

        @media screen and (min-width: 900px) {
            .debug-step {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .configuration {
                grid-column: auto;
            }
        }

        .debug-step>h6 {
            font-size: 0.9rem;
            grid-column: 1 / -1;
        }

        .debug-step h6 {
            font-size: 0.8rem;
        }

        .debug-step>div {
            padding: 12px;
            background-color: var(--vscode-editorWidget-background);
            border-radius: 8px;
            overflow-x: scroll;
        }

        .debug-step pre {
            border: 1px solid var(--vscode-editorWidget-border);
        }

        .debug-step code {
            color: var(--vscode-editor-foreground);
            background: transparent;
        }

        .debug-step table {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            border-collapse: collapse;
            margin-block: 12px;
        }

        .debug-step table th,
        .debug-step table td {
            padding: 8px;
            border: 1px solid var(--vscode-editorWidget-border);
            text-align: left;
        }

        .addr {
            color: #669955;
            font-weight: bold;
        }

        .read {
            color: #e35142;
            font-weight: bold;
        }

        .write {
            color: #0a58ca;
            font-weight: bold;
        }

        .vname {
            color: #ffc107;
            font-weight: bold;
        }

        /* Type check specific styles */
        .tc h6 {
            font-size: 0.8rem;
        }

        .type-check-result {
            background-color: var(--vscode-editorWidget-background);
            color: var(--vscode-editor-foreground);
            margin-block: 12px;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .scrollpane {
            width: 100%;
            height: 100%;
            overflow-x: scroll;
            overflow-y: scroll;
        }

        /* Proof styles (shared between debug and tc) */
        .tc .proof {
            grid-column: 1 / -1;
            padding: 24px 12px;
            text-align: center;
            display: inline-block;
            width: max-content;
        }

        .proof-content {
            padding: 24px 12px;
            text-align: center;
            display: inline-block;
            width: max-content;
        }

        .premise {
            display: inline-block;
            margin-left: 1em;
            margin-right: 1em;
        }

        .conclusion {
            display: inline;
        }

        .rule {
            border-top: 1px solid var(--vscode-editor-foreground);
            margin-block: 4px;
            text-align: right;
            display: block;
            height: 1px;
            z-index: 2;
        }

        .rulename {
            background-color: black;
            padding: 1px;
            color: white;
            font-size: x-small;
            visibility: hidden;
            z-index: 1;
            position: relative;
            display: inline-block;
            height: auto;
            top: -1.5em;
        }

        .conclusion>span,
        .conclusion>span>span {
            color: var(--vscode-editorInfo-foreground) !important;
        }

        .ctx {
            margin: 1em;
        }

        .proof:hover .rule .rulename {
            visibility: visible;
        }

        /* Content area animation */
        #content-area {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        #content-area.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        #content-area.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* Disable animation class */
        #content-area.no-animation {
            transition: none !important;
        }

        /* Debug highlighting styles */
        .highlighted {
            background-color: rgba(255, 193, 7, 0.3);
            font-weight: bold;
        }

        .read-highlight {
            background-color: rgba(34, 80, 139, 0.425);
            font-weight: bold;
        }

        .write-highlight {
            background-color: rgba(220, 20, 60, 0.3);
            font-weight: bold;
        }

        .analysis-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr;
        }

        @media screen and (min-width: 900px) {
            .analysis-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .analysis-grid > div,
        .transition-cfg,
        .run,
        .error,
        .analysis-summary {
            padding: 12px;
            background-color: var(--vscode-editorWidget-background);
            border-radius: 8px;
        }

        .error {
            color: var(--vscode-errorForeground);
        }


        /* Table styles */
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
        }

        th,
        td {
            border: 1px solid var(--vscode-panel-border);
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: var(--vscode-editor-selectionBackground);
            font-weight: bold;
        }

        .proof-table {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .proof-card {
            padding: 14px;
            background-color: var(--vscode-editorWidget-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 10px;
        }

        .proof-card h5 {
            margin-bottom: 12px;
        }

        .proof-layout {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr;
        }

        @media screen and (min-width: 900px) {
            .proof-layout {
                grid-template-columns: 1fr 1fr;
            }
        }

        .proof-program pre,
        .proof-vcs pre {
            margin: 6px 0 12px;
        }

        .proof-assertion {
            color: #0000ea;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .proof-vc {
            padding: 10px 0;
            border-top: 1px solid var(--vscode-panel-border);
        }

        .proof-vc:first-child {
            border-top: none;
            padding-top: 0;
        }

        .proof-vc-title {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .proof-vc-result {
            margin-top: 4px;
            font-weight: 600;
        }

        .proof-vc-result.success {
            color: #00aa5a;
        }

        .proof-vc-result.failure {
            color: #ea0000;
        }

        .analysis-summary {
            margin: 12px 0;
            border: 1px solid var(--vscode-panel-border);
        }

        .analysis-summary strong {
            display: block;
            margin-bottom: 6px;
        }

        .mermaid-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mermaid-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .graph-viewport {
            overflow: hidden;
            min-height: 220px;
            border: 1px solid var(--vscode-panel-border);
            border-radius: 10px;
            background: var(--vscode-editorWidget-background);
            cursor: grab;
        }

        .graph-viewport.dragging {
            cursor: grabbing;
        }

        .graph-stage {
            width: max-content;
            min-width: 100%;
            transform-origin: 0 0;
        }

        .mermaid {
            min-height: 80px;
            text-align: center;
        }

        .mermaid-source summary {
            cursor: pointer;
            color: var(--vscode-textLink-foreground);
        }

        .highlight-row {
            outline: 2px solid var(--vscode-textLink-foreground);
            background-color: var(--vscode-editor-selectionBackground);
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="tutorialBanner" class="tutorial-banner">
            <div>
                <h5 id="tutorialTitle"></h5>
                <p id="tutorialDescription"></p>
            </div>
            <div class="tutorial-actions">
                <button id="tutorialNext" onclick="tutorialNext()">Next</button>
                <button id="tutorialSkip" onclick="tutorialSkip()">Skip Tutorial</button>
            </div>
        </div>

        <p id="settingsToggle">Hide settings</p>

        <div class="settings">
            <h4 style="font-size: 1rem; margin-top: 12px;">While* visual interpreter</h4>

            <hr>
            <p>Settings</p>

            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                <label for="steps">Max. Steps (<=500) </label>
                        <label for="inputs">Input Values </label>
                        <input type="number" id="steps" placeholder="Max. Steps (<=500)"
                            onchange="updateSteps(this.value)" value="50">
                        <input type="text" id="inputs" placeholder="Type your input values"
                            onchange="updateInputs(this.value)" value="">
            </div>


            <hr>
            <p>Actions</p>

            <details class="panel-group" open>
                <summary>Execution &amp; Runtime</summary>
                <div class="panel-body action-grid">
                    <button id="action-run" class="action" onclick="run()">Run</button>
                    <button id="action-debug" class="action" onclick="debug()">Debug</button>
                </div>
            </details>

            <details class="panel-group">
                <summary>Proof Systems</summary>
                <div class="panel-body action-grid">
                    <button id="action-tc" class="action" onclick="tc()">Type check</button>
                    <button id="action-proof" class="action" onclick="proof()">Hoare (WPC)</button>
                </div>
            </details>

            <details class="panel-group" open>
                <summary>Dataflow Analyses</summary>
                <div class="panel-body action-grid">
                    <button id="action-rd" class="action" onclick="rdAnalysis()">Reaching Defs.</button>
                    <button id="action-liveness" class="action" onclick="livenessAnalysis()">Liveness</button>
                    <button id="action-reachability" class="action" onclick="reachabilityAnalysis()">Reach</button>
                    <button id="action-taint" class="action" onclick="taintAnalysis()">Taint</button>
                </div>
            </details>

            <details class="panel-group">
                <summary>Model Checking</summary>
                <div class="panel-body action-grid">
                    <button id="action-transition-cfg" class="action" onclick="transitionCfg()">Transition CFG</button>
                </div>
            </details>
            <hr>
        </div>

        <div id="output">
            <div id="content-area">
                <!-- Dynamic content will be inserted here -->
            </div>
        </div>

    </div>

    <script src="__MERMAID_SCRIPT_URI__"></script>
    <script>
        const vscode = acquireVsCodeApi();
        let mermaidInitialized = false;
        let tutorialSteps = [];
        let tutorialIndex = -1;
        const requestedTutorialExamples = new Set();
        const graphViewportStates = new Map();

        // Initialize webview state
        let currentMode = 'empty';
        // Listen for messages from the extension
        window.addEventListener('message', event => {
            const message = event.data;

            switch (message.command) {
                case 'updateContent':
                    updateContent(message.mode, message.output, message.animate !== false);
                    break;
                case 'updateSettings':
                    updateSettings(message.steps, message.inputs);
                    break;
                case 'startTutorial':
                    startTutorial(message.steps || []);
                    break;
            }
        });

        function updateContent(mode, output, animate = true) {
            currentMode = mode;
            const contentArea = document.getElementById('content-area');
            captureGraphViewportStates(contentArea);

            // If no animation is requested, apply content immediately
            if (!animate) {
                contentArea.classList.add('no-animation');
                applyContent(contentArea, mode, output);
                // Remove no-animation class after a brief delay to allow future animations
                setTimeout(() => {
                    contentArea.classList.remove('no-animation');
                }, 50);
                return;
            }

            // Animate content change
            contentArea.classList.add('fade-out');

            setTimeout(() => {
                applyContent(contentArea, mode, output);
                contentArea.classList.remove('fade-out');
                contentArea.classList.add('fade-in');

                // Clean up animation classes
                setTimeout(() => {
                    contentArea.classList.remove('fade-in');
                }, 300);
            }, 150);
        }

        function applyContent(contentArea, mode, output) {
            if (mode === 'empty') {
                contentArea.innerHTML = '<p>Select an action to see results.</p>';
                return;
            }

            let html = '';
            switch (mode) {
                case 'run':
                case 'debug':
                case 'tc':
                    html = output;
                    break;
                case 'proof':
                    html = transformProofHtml(output);
                    break;
                case 'analysis':
                    html = output;
                    break;
                case 'transition-cfg':
                    html = output;
                    break;
            }

            contentArea.innerHTML = html;
            renderMermaid(contentArea);
            if (tutorialIndex >= 0) {
                renderTutorial();
            }
        }

        async function renderMermaid(contentArea) {
            if (!window.mermaid) {
                return;
            }

            if (!mermaidInitialized) {
                window.mermaid.initialize({
                    startOnLoad: false,
                    securityLevel: 'loose',
                    theme: 'neutral'
                });
                mermaidInitialized = true;
            }

            const diagrams = Array.from(contentArea.querySelectorAll('.mermaid'));
            if (diagrams.length === 0) {
                return;
            }

            try {
                diagrams.forEach(element => element.removeAttribute('data-processed'));
                await window.mermaid.run({
                    querySelector: '.mermaid'
                });
                initializeGraphViewports(contentArea);
            } catch (error) {
                console.error('Failed to render Mermaid diagram', error);
            }
        }

        function defaultGraphViewportState() {
            return { scale: 1, translateX: 0, translateY: 0 };
        }

        function captureGraphViewportStates(root) {
            if (!root) {
                return;
            }

            root.querySelectorAll('.mermaid-wrapper[data-graph-key]').forEach(wrapper => {
                const key = wrapper.dataset.graphKey;
                const state = wrapper._graphViewportState;
                if (key && state) {
                    graphViewportStates.set(key, { ...state });
                }
            });
        }

        function initializeGraphViewports(root) {
            root.querySelectorAll('.mermaid-wrapper[data-graph-key]').forEach(wrapper => {
                const viewport = wrapper.querySelector('.graph-viewport');
                const stage = wrapper.querySelector('.graph-stage');
                const key = wrapper.dataset.graphKey;
                if (!viewport || !stage || !key) {
                    return;
                }

                const savedState = graphViewportStates.get(key);
                const state = savedState ? { ...savedState } : defaultGraphViewportState();
                wrapper._graphViewportState = state;
                applyGraphTransform(wrapper);

                let dragStartX = 0;
                let dragStartY = 0;
                let pointerId = null;

                viewport.onpointerdown = event => {
                    pointerId = event.pointerId;
                    dragStartX = event.clientX - state.translateX;
                    dragStartY = event.clientY - state.translateY;
                    viewport.classList.add('dragging');
                    viewport.setPointerCapture(event.pointerId);
                };

                viewport.onpointermove = event => {
                    if (pointerId !== event.pointerId) {
                        return;
                    }

                    state.translateX = event.clientX - dragStartX;
                    state.translateY = event.clientY - dragStartY;
                    applyGraphTransform(wrapper);
                };

                const releasePointer = event => {
                    if (pointerId !== event.pointerId) {
                        return;
                    }

                    pointerId = null;
                    viewport.classList.remove('dragging');
                    graphViewportStates.set(key, { ...state });
                    if (viewport.hasPointerCapture(event.pointerId)) {
                        viewport.releasePointerCapture(event.pointerId);
                    }
                };

                viewport.onpointerup = releasePointer;
                viewport.onpointercancel = releasePointer;
                viewport.onwheel = event => {
                    event.preventDefault();
                    const factor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
                    updateGraphZoom(wrapper, factor);
                };
            });
        }

        function applyGraphTransform(wrapper) {
            const stage = wrapper.querySelector('.graph-stage');
            const key = wrapper.dataset.graphKey;
            const state = wrapper._graphViewportState;
            if (!stage || !key || !state) {
                return;
            }

            stage.style.transform = `translate(${state.translateX}px, ${state.translateY}px) scale(${state.scale})`;
            graphViewportStates.set(key, { ...state });
        }

        function updateGraphZoom(wrapper, factor) {
            const state = wrapper?._graphViewportState;
            if (!state) {
                return;
            }

            state.scale = Math.min(4, Math.max(0.4, state.scale * factor));
            applyGraphTransform(wrapper);
        }

        function zoomGraph(button, factor) {
            const wrapper = button.closest('.mermaid-wrapper');
            if (!wrapper) {
                return;
            }

            updateGraphZoom(wrapper, factor);
        }

        function resetGraphView(button) {
            const wrapper = button.closest('.mermaid-wrapper');
            if (!wrapper) {
                return;
            }

            wrapper._graphViewportState = defaultGraphViewportState();
            applyGraphTransform(wrapper);
        }

        function resetGraphViewportStates() {
            graphViewportStates.clear();
        }

        function nodeClick(id) {
            const row = document.getElementById(`dfRow-${id}`);
            if (!row) {
                return;
            }

            const highlighted = document.querySelector('.highlight-row');
            if (highlighted) {
                highlighted.classList.remove('highlight-row');
            }

            row.classList.add('highlight-row');
            row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function transformProofHtml(output) {
            const container = document.createElement('div');
            container.innerHTML = output;
            const rows = Array.from(container.querySelectorAll('.proof-row'));

            if (rows.length === 0) {
                return output;
            }

            const cards = rows.map((row, index) => renderProofCard(row, index + 1)).join('');
            return `<div class="proof-table">${cards}</div>`;
        }

        function renderProofCard(row, index) {
            const fields = Array.from(row.querySelectorAll('table tr')).map(extractProofField);
            const statement = fields.find(field => field.label === 'Statement')?.value || '';
            const wpc = fields.find(field => field.label === 'WPC')?.value || '';
            const post = fields.find(field => field.label === 'Post')?.value || '';
            const vcs = Array.from(row.querySelectorAll('ol > li')).map(extractProofVc);
            const vcsHtml = vcs.length > 0
                ? vcs.map(renderProofVc).join('')
                : '<p>No verification conditions.</p>';

            return `
                <section class="proof-card">
                    <h5>Proof Step ${index}</h5>
                    <div class="proof-layout">
                        <div class="proof-program">
                            ${wpc ? `<div class="proof-assertion">{ ${wpc} }</div>` : ''}
                            <pre><code>${statement}</code></pre>
                            ${post ? `<div class="proof-assertion">{ ${post} }</div>` : ''}
                        </div>
                        <div class="proof-vcs">
                            ${vcsHtml}
                        </div>
                    </div>
                </section>`;
        }

        function extractProofField(row) {
            const label = row.querySelector('th')?.textContent?.trim() || '';
            const value = row.querySelector('td code')?.textContent?.trim() || '';
            return { label, value };
        }

        function extractProofVc(item) {
            const explanation = item.querySelector('strong')?.textContent?.trim() || '';
            const implication = item.querySelector('pre code')?.innerHTML || '';
            const resultText = item.querySelector('div:last-child')?.textContent?.replace(/^Result:\s*/, '').trim() || '';
            return { explanation, implication, resultText };
        }

        function renderProofVc(vc) {
            const success = vc.resultText === 'successful.';
            const symbol = success ? '✔' : '✖';
            const klass = success ? 'success' : 'failure';

            return `
                <section class="proof-vc">
                    <div class="proof-vc-title">${escapeHtml(vc.explanation)}</div>
                    <pre><code>${vc.implication}</code></pre>
                    <div class="proof-vc-result ${klass}">${symbol} ${escapeHtml(vc.resultText || 'unknown')}</div>
                </section>`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function updateSettings(steps, inputs) {
            document.getElementById('steps').value = steps;
            document.getElementById('inputs').value = inputs;
        }

        function startTutorial(steps) {
            tutorialSteps = Array.isArray(steps) ? steps : [];
            tutorialIndex = 0;
            requestedTutorialExamples.clear();
            renderTutorial();
        }

        function tutorialNext() {
            if (tutorialIndex < 0) {
                return;
            }
            tutorialIndex += 1;
            if (tutorialIndex >= tutorialSteps.length) {
                finishTutorial();
                return;
            }
            renderTutorial();
        }

        function tutorialSkip() {
            finishTutorial();
        }

        function finishTutorial() {
            tutorialSteps = [];
            tutorialIndex = -1;
            requestedTutorialExamples.clear();
            clearTutorialHighlight();
            document.getElementById('tutorialBanner').classList.remove('active');
        }

        function renderTutorial() {
            if (tutorialIndex < 0 || tutorialIndex >= tutorialSteps.length) {
                finishTutorial();
                return;
            }

            const step = tutorialSteps[tutorialIndex];
            document.getElementById('tutorialTitle').textContent = `Tutorial ${tutorialIndex + 1}/${tutorialSteps.length}: ${step.title}`;
            document.getElementById('tutorialDescription').textContent = step.description;
            document.getElementById('tutorialNext').textContent = tutorialIndex === tutorialSteps.length - 1 ? 'Finish' : 'Next';
            document.getElementById('tutorialBanner').classList.add('active');

            if (step.exampleId && !requestedTutorialExamples.has(tutorialIndex)) {
                requestedTutorialExamples.add(tutorialIndex);
                vscode.postMessage({
                    command: 'tutorialOpenExample',
                    exampleId: step.exampleId
                });
            }

            if (step.buttonId) {
                highlightTutorialButton(step.buttonId);
            } else {
                clearTutorialHighlight();
            }
        }

        function clearTutorialHighlight() {
            document.querySelectorAll('.tutorial-highlight').forEach(element => {
                element.classList.remove('tutorial-highlight');
            });
            document.querySelectorAll('.panel-group.tutorial-open').forEach(element => {
                element.classList.remove('tutorial-open');
            });
        }

        function highlightTutorialButton(buttonId) {
            clearTutorialHighlight();
            const button = document.getElementById(buttonId);
            if (!button) {
                return;
            }

            button.classList.add('tutorial-highlight');
            if (buttonId === 'tutorialNext') {
                button.scrollIntoView({ block: 'center', behavior: 'smooth' });
                return;
            }
            const group = button.closest('.panel-group');
            if (group) {
                group.classList.add('tutorial-open');
                group.open = true;
            }
            button.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        function advanceTutorialForButton(buttonId) {
            if (tutorialIndex < 0 || tutorialIndex >= tutorialSteps.length) {
                return;
            }

            if (tutorialSteps[tutorialIndex].buttonId === buttonId) {
                tutorialNext();
            }
        }

        function debugPrev() {
            advanceTutorialForButton('action-debug-prev');
            vscode.postMessage({
                command: 'debugPrev',
            });
        }

        function debugNext() {
            advanceTutorialForButton('action-debug-next');
            vscode.postMessage({
                command: 'debugNext',
            });
        }

        function analysisPrev() {
            advanceTutorialForButton('action-analysis-prev');
            vscode.postMessage({
                command: 'analysisPrev',
            });
        }

        function analysisNext() {
            advanceTutorialForButton('action-analysis-next');
            vscode.postMessage({
                command: 'analysisNext',
            });
        }

        function run() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-run');
            vscode.postMessage({
                command: 'run',
            });
        }

        function debug() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-debug');
            vscode.postMessage({
                command: 'debug',
            });
        }

        function tc() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-tc');
            vscode.postMessage({
                command: 'tc',
            });
        }

        function proof() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-proof');
            vscode.postMessage({
                command: 'proof',
            });
        }

        function livenessAnalysis() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-liveness');
            vscode.postMessage({
                command: 'liveness-analysis',
            });
        }

        function reachabilityAnalysis() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-reachability');
            vscode.postMessage({
                command: 'reachability-analysis',
            });
        }

        function rdAnalysis() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-rd');
            vscode.postMessage({
                command: 'rd-analysis',
            });
        }

        function taintAnalysis() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-taint');
            vscode.postMessage({
                command: 'taint-analysis',
            });
        }

        function transitionCfg() {
            resetGraphViewportStates();
            advanceTutorialForButton('action-transition-cfg');
            vscode.postMessage({
                command: 'transition-cfg',
            });
        }

        function updateSteps(value) {
            vscode.postMessage({
                command: 'updateSteps',
                value,
            });
        }

        function updateInputs(value) {
            vscode.postMessage({
                command: 'updateInputs',
                value,
            });
        }

        function toggleSettings() {
            const settingsDiv = document.querySelector('.settings');
            const toggleButton = document.getElementById('settingsToggle');

            if (settingsDiv.classList.contains('hidden')) {
                settingsDiv.classList.remove('hidden');
                toggleButton.textContent = 'Hide settings';
            } else {
                settingsDiv.classList.add('hidden');
                toggleButton.textContent = 'Show settings';
            }
        }

        // Add event listener when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            const toggleButton = document.getElementById('settingsToggle');
            toggleButton.addEventListener('click', toggleSettings);
        });
    </script>
</body>
